<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="100%" height="100%">
  <defs>
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes scan { 0% { transform: translateY(-740px); } 100% { transform: translateY(740px); } }
      .bg { fill: #ffffff; }
      .terminal-text { font-family: 'Fira Code', monospace; fill: #db2777; font-size: 16px; }
      .cursor { animation: blink 1s infinite; fill: #db2777; }
      .scan-line { animation: scan 3.5s linear infinite; }
    </style>
    <linearGradient id="pinkGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>
  <rect class="bg" width="1280" height="740" rx="16" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="50" y="40" width="1180" height="660" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <circle cx="80" cy="70" r="6" fill="#ff5f56"/>
  <circle cx="100" cy="70" r="6" fill="#ffbd2e"/>
  <circle cx="120" cy="70" r="6" fill="#27c93f"/>
  <text x="80" y="130" class="terminal-text">user@dev:~$ cat README.md</text>
  <rect x="300" y="115" width="10" height="20" class="cursor" />
  <text x="80" y="210" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="52" fill="url(#pinkGradLight)">SOURABH NATERIA</text>
  <text x="80" y="260" font-family="'Fira Code', monospace" font-size="22" fill="#4b5563">&gt; FULLSTACK DEVELOPER | frontend &amp; backend</text>
  <line x1="0" y1="0" x2="1280" y2="0" stroke="#db2777" stroke-width="3" class="scan-line" opacity="0.4"/>
</svg>
