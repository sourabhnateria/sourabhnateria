<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250">
<defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#13071f"/><stop offset="1" stop-color="#2a0b3b"/></linearGradient><linearGradient id="bar"><stop stop-color="#ff3eb5"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
<style><![CDATA[.bar{transform-origin:left;transform:scaleX(0);animation:grow .8s ease forwards}.x1{animation-delay:.25s}.x2{animation-delay:.4s}.x3{animation-delay:.55s}.x4{animation-delay:.7s}.x5{animation-delay:.85s}@keyframes grow{to{transform:scaleX(1)}}.lbl{opacity:0;animation:fade .5s ease forwards}.l1{animation-delay:.25s}.l2{animation-delay:.4s}.l3{animation-delay:.55s}.l4{animation-delay:.7s}.l5{animation-delay:.85s}@keyframes fade{to{opacity:1}}]]></style>
<rect x="3" y="3" width="514" height="244" rx="24" fill="url(#b)" stroke="#ff4fb9"/><text x="24" y="34" fill="#fff" font-family="Arial" font-size="16" font-weight="800">Stack Focus</text>
