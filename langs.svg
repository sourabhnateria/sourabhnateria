<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
    .bg { fill: #0d1117; rx: 8; stroke: #30363d; }
    .title { fill: #c9d1d9; font-family: 'Inter', sans-serif; font-weight: bold; font-size: 16px; }
    .lang { fill: #c9d1d9; font-family: 'Inter', sans-serif; font-size: 12px; }
    .bar-bg { fill: #21262d; rx: 4; }
    .bar { rx: 4; animation: fillBar 1.5s forwards ease-out; }
    @keyframes fillBar { from { width: 0; } }
  </style>
  <rect class="bg" width="100%" height="100%" />
  <text x="25" y="35" class="title">🔥 Top Languages</text>
  
  <g transform="translate(25, 60)">
    <text class="lang" y="10">TypeScript</text><rect class="bar-bg" x="90" y="0" width="260" height="12"/><rect class="bar" x="90" y="0" width="120" height="12" fill="#3178c6"/>
    <text class="lang" y="40">JavaScript</text><rect class="bar-bg" x="90" y="30" width="260" height="12"/><rect class="bar" x="90" y="30" width="80" height="12" fill="#f1e05a"/>
    <text class="lang" y="70">Python</text><rect class="bar-bg" x="90" y="60" width="260" height="12"/><rect class="bar" x="90" y="60" width="50" height="12" fill="#3572A5"/>
    <text class="lang" y="100">HTML/CSS</text><rect class="bar-bg" x="90" y="90" width="260" height="12"/><rect class="bar" x="90" y="90" width="30" height="12" fill="#e34c26"/>
  </g>
</svg>
